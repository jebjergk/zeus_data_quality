name: CI

on:
  pull_request:
  push:
    branches:
      - "*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files
      - name: Run tests
        env:
          STREAMLIT_SERVER_HEADLESS: "1"
        run: pytest -q
      - name: Guard check
        run: python tools/guard_check.py
      - name: Snapshot drift check
        run: |
          if [ -n "$(git status --porcelain snapshots)" ]; then
            echo "Snapshot drift detected. Run python tools/mirror_snapshots.py" >&2
            exit 1
          fi
